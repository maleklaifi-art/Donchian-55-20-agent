services:
  nr7-demo-agent:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BINANCE_TESTNET_API_KEY: "${BINANCE_TESTNET_API_KEY}"
      BINANCE_TESTNET_API_SECRET: "${BINANCE_TESTNET_API_SECRET}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD}"
      AUTO_START_NEW_TRADES: "false"
      DATA_DIR: "/data"
    volumes:
      - nr7_demo_data:/data

volumes:
  nr7_demo_data:
