<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NR7 Demo Agent Login</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--border:#243045;--accent:#60a5fa;--danger:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#172554 0,#0b1020 38%,#070b14 100%);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:rgba(17,24,39,.94);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:24px}.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#14213d;color:#93c5fd;font-size:12px;font-weight:700;margin-bottom:18px}.warn{background:#3a1d1d;border:1px solid #7f1d1d;color:#fecaca;padding:10px 12px;border-radius:10px;margin-bottom:16px;font-size:13px}.error{color:#fecaca;margin:0 0 14px}.field{display:grid;gap:8px}label{font-size:13px;color:var(--muted)}input{width:100%;background:#0b1220;border:1px solid #334155;color:white;border-radius:10px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,.15)}button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px 16px;background:var(--accent);color:#07111f;font-weight:800;font-size:15px;cursor:pointer}.foot{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">BINANCE SPOT TESTNET ONLY</div>
    <h1>NR7 Demo Agent</h1>
    <p class="sub">Private dashboard for the autonomous demo trader.</p>
    __INSECURE_WARNING__
    __ERROR__
    <form method="post" action="/login">
      <div class="field">
        <label for="password">Dashboard password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button type="submit">Open dashboard</button>
    </form>
    <p class="foot">API keys are never entered into this page. Testnet credentials stay in your cloud provider's environment variables.</p>
  </main>
</body>
</html>
